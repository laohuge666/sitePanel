<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
Website Monitor
</title>


<meta name="viewport" content="width=device-width, initial-scale=1">


<style>


body{

    font-family:
    Arial,
    sans-serif;

    background:#f5f5f5;

    margin:0;

    padding:20px;

}



.container{

    max-width:1000px;

    margin:auto;

}



h1{

    text-align:center;

}



.card{

    background:white;

    padding:20px;

    border-radius:10px;

    margin-bottom:20px;

    box-shadow:
    0 2px 8px
    rgba(0,0,0,.1);

}



input{

    padding:10px;

    margin:5px;

    width:220px;

}



button{

    padding:10px 15px;

    border:0;

    border-radius:5px;

    cursor:pointer;

}



.add{

    background:#2196f3;

    color:white;

}



.refresh{

    background:#4caf50;

    color:white;

}



.delete{

    background:#f44336;

    color:white;

}



table{

    width:100%;

    border-collapse:collapse;

}



th,td{

    padding:10px;

    border-bottom:1px solid #ddd;

    text-align:left;

}



.online{

    color:green;

    font-weight:bold;

}



.offline{

    color:red;

    font-weight:bold;

}



.warning{

    color:#ff9800;

    font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<h1>
🌐 Website Monitor
</h1>



<div class="card">


<h3>
Add Website
</h3>



<input
id="name"
placeholder="Website name"
>


<input
id="url"
placeholder="https://example.com"
>


<input
id="interval"
placeholder="Interval seconds"
value="300"
>


<button
class="add"
onclick="addWebsite()"
>

Add

</button>


</div>





<div class="card">


<button
class="refresh"
onclick="loadStatus()"
>

Refresh

</button>


<button
class="refresh"
onclick="checkAll()"
>

Check All

</button>



</div>





<div class="card">


<table>


<thead>

<tr>

<th>
Name
</th>


<th>
URL
</th>


<th>
Status
</th>


<th>
Delay
</th>


<th>
Last Check
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="list">


</tbody>


</table>


</div>



</div>






<script>


async function api(
url,
method="GET",
body=null
){


    const option={

        method,

        headers:{
            "Content-Type":
            "application/json"
        }

    };


    if(body){

        option.body=
        JSON.stringify(body);

    }



    const res =
        await fetch(
            url,
            option
        );


    return await res.json();


}






async function loadStatus(){


    const data =
        await api(
            "/api/status"
        );



    const box =
        document.getElementById(
            "list"
        );



    box.innerHTML="";



    data.forEach(
        site=>{


            const tr =
            document.createElement(
                "tr"
            );



            tr.innerHTML=`

<td>
${site.name}
</td>


<td>
<a href="${site.url}" target="_blank">
${site.url}
</a>
</td>


<td class="${site.status}">

${site.status}

</td>


<td>

${site.responseTime || 0} ms

</td>


<td>

${site.lastCheck || "-"}

</td>


<td>

<button
class="delete"
onclick="deleteWebsite('${site.name}')"
>

Delete

</button>

</td>


`;



            box.appendChild(
                tr
            );


        }
    );



}







async function addWebsite(){


    const name =
    document.getElementById(
        "name"
    ).value;



    const url =
    document.getElementById(
        "url"
    ).value;



    const interval =
    document.getElementById(
        "interval"
    ).value;



    const result =
    await api(
        "/api/add",
        "POST",
        {

            name,

            url,

            interval

        }
    );



    if(result.success){

        alert(
            "Added"
        );

        loadStatus();

    }
    else{

        alert(
            result.error
        );

    }


}






async function deleteWebsite(name){


    if(
        !confirm(
            "Delete "+name+"?"
        )
    )
    return;



    await api(
        "/api/delete",
        "POST",
        {

            name

        }
    );



    loadStatus();


}







async function checkAll(){


    await api(
        "/api/check",
        "POST"
    );


    loadStatus();


}





loadStatus();



setInterval(
    loadStatus,
    30000
);


</script>



</body>

</html>
